# Force an ASCII-safe locale for the Gradle JVM. The machine default is Turkish
# (tr), whose dotless-i rule corrupts internal toUpperCase() calls in the
# Android toolchain and produces bizarre failures ("BUİLD FAILED").
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# The repo lives under "...\Masaüstü\..." (non-ASCII "ü"), which AGP refuses by
# default on Windows. If the build still fails on this, the real fix is moving
# the project to an ASCII path such as C:\dev\technician_app.
android.overridePathCheck=true
